title: "Product #{{ product_id }}"
description: One product — sales over time, the orders it appears in, and linked customers.

source: warehouse

variables:
  product_id:
    input: text
    default: "10"

queries:
  summary:
    sql: |
      SELECT ANY_VALUE(product_name)  AS product_name,
             ANY_VALUE(category_name) AS category_name,
             SUM(quantity)            AS units_sold,
             SUM(line_revenue_after_discount) AS revenue,
             COUNT(DISTINCT order_id)    AS orders,
             COUNT(DISTINCT customer_id) AS customers
      FROM {{ ref('fct_order_items') }}
      WHERE {{ filter('product_id', product_id) }}

  monthly_sales:
    sql: |
      SELECT order_month::date AS order_month,
             SUM(line_revenue_after_discount) AS revenue,
             SUM(quantity) AS units
      FROM {{ ref('fct_order_items') }}
      WHERE {{ filter('product_id', product_id) }}
      GROUP BY 1 ORDER BY 1

  order_lines:
    sql: |
      SELECT order_id, customer_id, order_date, quantity, line_revenue_after_discount
      FROM {{ ref('fct_order_items') }}
      WHERE {{ filter('product_id', product_id) }}
      ORDER BY order_date DESC

charts:
  kpi_revenue:   { type: kpi, query: summary, label: Revenue, value: revenue, style: { value: { format: currency } } }
  kpi_units:     { type: kpi, query: summary, label: Units Sold, value: units_sold, style: { value: { format: integer } } }
  kpi_orders:    { type: kpi, query: summary, label: Orders, value: orders, style: { value: { format: integer } } }
  kpi_customers: { type: kpi, query: summary, label: Customers, value: customers, style: { value: { format: integer } } }

  revenue_trend:
    title: Revenue by Month
    query: monthly_sales
    type: bar
    x: order_month
    y: revenue
    style: { number_format: currency }
  units_trend:
    title: Units Sold by Month
    query: monthly_sales
    type: line
    x: order_month
    y: units

  lines_table:
    title: Order Lines — click to open the order or the customer
    query: order_lines
    type: table
    link: "/order/?order_id={{ order_id }}"
    style:
      columns:
        order_id: { label: Order }
        order_date: { label: Date }
        customer_id:
          label: Customer
          link: "/customer/?customer_id={{ customer_id }}"
        quantity: { label: Qty, format: integer }
        line_revenue_after_discount: { label: Revenue, format: currency }

rows:
  - cols: [kpi_revenue, kpi_units, kpi_orders, kpi_customers]
  - cols: [revenue_trend, units_trend]
  - lines_table
