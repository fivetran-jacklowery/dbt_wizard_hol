title: Orders — Deep Dive
description: Order volume, revenue trends, and geographic breakdown — one row per order from fct_orders.

source: warehouse

queries:
  kpis:
    description: Single-row aggregate for headline KPI tiles.
    sql: |
      SELECT
        COUNT(*)                          AS total_orders,
        ROUND(SUM(order_revenue), 2)      AS total_revenue,
        ROUND(AVG(order_revenue), 2)      AS avg_order_value,
        ROUND(AVG(line_item_count), 1)    AS avg_items_per_order
      FROM {{ ref('fct_orders') }}

  monthly_trend:
    description: Monthly order count and revenue for trend charts.
    sql: |
      SELECT
        DATE_TRUNC('month', order_date::DATE)   AS order_month,
        COUNT(*)                                 AS order_count,
        ROUND(SUM(order_revenue), 2)             AS monthly_revenue
      FROM {{ ref('fct_orders') }}
      GROUP BY DATE_TRUNC('month', order_date::DATE)
      ORDER BY order_month

  revenue_by_state:
    description: Revenue and order count by shipping state, top 10.
    sql: |
      SELECT
        shipping_state,
        COUNT(*)                          AS order_count,
        ROUND(SUM(order_revenue), 2)      AS revenue
      FROM {{ ref('fct_orders') }}
      GROUP BY shipping_state
      ORDER BY revenue DESC
      LIMIT 10

charts:
  kpi_orders:
    description: Total number of orders placed.
    label: Total Orders
    query: kpis
    type: kpi
    value: total_orders
    format: integer

  kpi_revenue:
    description: Sum of order revenue across all orders.
    label: Total Revenue
    query: kpis
    type: kpi
    value: total_revenue
    format: currency_whole

  kpi_avg_order:
    description: Average revenue per order.
    label: Avg Order Value
    query: kpis
    type: kpi
    value: avg_order_value
    format: currency_whole

  monthly_orders:
    description: Monthly order volume over time.
    title: Monthly Order Volume
    query: monthly_trend
    type: bar
    x: order_month
    y: order_count
    style:
      orientation: vertical

  monthly_revenue:
    description: Monthly revenue trend over time.
    title: Monthly Revenue Trend
    query: monthly_trend
    type: line
    x: order_month
    y: monthly_revenue
    format: currency_whole

  revenue_by_state:
    description: Revenue by shipping state — top 10 states.
    title: Revenue by State (Top 10)
    query: revenue_by_state
    type: bar
    x: shipping_state
    y: revenue
    format: currency_whole

rows:
  - title: Summary
    cols: [kpi_orders, kpi_revenue, kpi_avg_order]
  - title: Trends
    cols: [monthly_revenue, monthly_orders]
  - title: Geography
    cols: [revenue_by_state]
