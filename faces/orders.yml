title: Orders
description: Canonical order list — filter, then click a row to open the order detail.

source: warehouse

variables:
  order_status:
    label: Status
    input: text
  shipping_state:
    label: State
    input: text
  customer_id:
    label: Customer ID
    input: text

queries:
  order_rows:
    sql: |
      SELECT order_id, order_date, customer_id, shipping_state, order_status,
             order_revenue_after_discount, line_item_count
      FROM {{ ref('fct_orders') }}
      WHERE {{ filter('order_status', order_status) }}
        AND {{ filter('shipping_state', shipping_state) }}
        AND {{ filter('customer_id', customer_id) }}
      ORDER BY order_date DESC

  by_state:
    sql: |
      SELECT shipping_state,
             COUNT(*) AS orders,
             SUM(order_revenue_after_discount) AS revenue
      FROM {{ ref('fct_orders') }}
      GROUP BY 1 ORDER BY revenue DESC LIMIT 15

charts:
  state_bar:
    title: Revenue by State — click to filter
    query: by_state
    type: bar
    x: shipping_state
    y: revenue
    format: currency
    link: "/orders/?shipping_state={{ x }}"

  order_table:
    title: Orders — click a row for detail
    query: order_rows
    type: table
    link: "/order/?order_id={{ order_id }}"
    style:
      columns:
        customer_id:
          label: Customer
          link: "/customer/?customer_id={{ customer_id }}"
        shipping_state:
          label: State
          link: "/orders/?shipping_state={{ shipping_state }}"
        order_revenue_after_discount: { label: Revenue, format: currency }
        line_item_count: { label: Items, format: integer }

rows:
  - state_bar
  - order_table
