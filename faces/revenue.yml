title: Revenue
description: "Revenue analytics — trends over time, average order value, and the category, region, and customer cuts. Filter by date to slice any window."

source: warehouse

variables:
  date_range:
    input: daterange
    # no default → picker starts empty; filter_date_range is null-safe (shows all)

queries:
  kpis:
    sql: |
      SELECT
        SUM(order_revenue_after_discount)                                  AS net_revenue,
        AVG(total_amount)                                                  AS aov,
        COUNT(*)                                                           AS orders,
        SUM(order_revenue_after_discount) / NULLIF(COUNT(DISTINCT customer_id), 0) AS rev_per_customer
      FROM {{ ref('fct_orders') }}
      WHERE is_cancelled = false
        AND {{ filter_date_range('order_date', date_range) }}

  revenue_by_month_type:
    sql: |
      SELECT o.order_month::date AS order_month, c.customer_type,
             SUM(o.order_revenue_after_discount) AS revenue
      FROM {{ ref('fct_orders') }} o
      JOIN {{ ref('dim_customers') }} c USING (customer_id)
      WHERE o.is_cancelled = false
        AND o.order_month < DATE_TRUNC('month', CURRENT_DATE)
        AND {{ filter_date_range('order_date', date_range) }}
      GROUP BY 1, 2 ORDER BY 1

  aov_by_month:
    sql: |
      SELECT order_month::date AS order_month, AVG(total_amount) AS aov
      FROM {{ ref('fct_orders') }}
      WHERE is_cancelled = false
        AND order_month < DATE_TRUNC('month', CURRENT_DATE)
        AND {{ filter_date_range('order_date', date_range) }}
      GROUP BY 1 ORDER BY 1

  revenue_by_category:
    sql: |
      SELECT category_name, SUM(line_revenue_after_discount) AS revenue
      FROM {{ ref('fct_order_items') }}
      WHERE {{ filter_date_range('order_date', date_range) }}
      GROUP BY 1 ORDER BY revenue DESC

  revenue_by_region:
    sql: |
      SELECT c.region, SUM(o.order_revenue_after_discount) AS revenue
      FROM {{ ref('fct_orders') }} o
      JOIN {{ ref('dim_customers') }} c USING (customer_id)
      WHERE o.is_cancelled = false
        AND {{ filter_date_range('order_date', date_range) }}
      GROUP BY 1 ORDER BY revenue DESC

  top_customers:
    sql: |
      SELECT c.full_name, c.customer_id,
             SUM(o.order_revenue_after_discount) AS revenue
      FROM {{ ref('fct_orders') }} o
      JOIN {{ ref('dim_customers') }} c USING (customer_id)
      WHERE o.is_cancelled = false
        AND {{ filter_date_range('order_date', date_range) }}
      GROUP BY 1, 2 ORDER BY revenue DESC LIMIT 10

charts:
  kpi_net_revenue:    { type: kpi, query: kpis, label: Net Revenue, value: net_revenue, style: { value: { format: "$,.0f" } } }
  kpi_aov:            { type: kpi, query: kpis, label: Avg Order Value, value: aov, style: { value: { format: "$,.2f" } } }
  kpi_rev_per_cust:   { type: kpi, query: kpis, label: Revenue / Customer, value: rev_per_customer, style: { value: { format: "$,.0f" } } }
  kpi_orders:         { type: kpi, query: kpis, label: Orders, value: orders, style: { value: { format: ",.0f" } } }

  revenue_trend:
    title: Net Revenue by Month — by Customer Type
    query: revenue_by_month_type
    type: area
    x: order_month
    y: revenue
    color: customer_type
    style: { stack: zero, number_format: "$,.0f" }

  aov_trend:
    title: Average Order Value by Month
    query: aov_by_month
    type: line
    x: order_month
    y: aov
    style: { number_format: "$,.2f" }

  category_bar:
    title: Revenue by Category — click to explore products
    query: revenue_by_category
    type: bar
    x: category_name
    y: revenue
    style: { number_format: "$,.0f" }
    sort: { by: revenue, order: desc }
    link: "/products/?category_name={{ x }}"

  region_bar:
    title: Revenue by Region — click to explore customers
    query: revenue_by_region
    type: bar
    x: region
    y: revenue
    style: { number_format: "$,.0f" }
    sort: { by: revenue, order: desc }
    link: "/customers/?region={{ x }}"

  top_customers_table:
    title: Top Customers by Revenue — click a row to open the customer
    query: top_customers
    type: table
    link: "/customer/?customer_id={{ customer_id }}"
    style:
      columns:
        full_name: { label: Customer }
        revenue: { label: Net Revenue, format: currency }

rows:
  - cols: [kpi_net_revenue, kpi_aov, kpi_rev_per_cust, kpi_orders]
  - revenue_trend
  - cols: [aov_trend, category_bar]
  - cols: [region_bar, top_customers_table]
