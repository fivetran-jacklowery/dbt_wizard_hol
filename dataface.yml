# Dataface project configuration
#
# This file anchors your project root. Running `dft serve` from any
# subdirectory will walk up to find this file and use its directory
# as the serve root.
#
# Credentials and database identity stay in dbt profiles.yml / env vars.
# Only Dataface runtime and serving preferences belong here.
#
# serve:
#   # Override the SQL dialect (auto-detected from dbt profile when possible)
#   # dialect: bigquery
#
#   # dbt target override (defaults to DBT_TARGET env var, then profile default)
#   # target: dev

# Project default theme — inherited by every face without an explicit `theme:`.
# Resolution order: DFT_DEFAULT_THEME env var > this key > built-in default.
theme: cream

# Default data source — reuse the lab's active dbt profile.
# Queries with no explicit `source:` resolve to this; tables resolve in the
# profile's configured Unity Catalog catalog/schema.
default_source: warehouse
sources:
  warehouse:
    type: dbt_profile
    profile: hol_dbx_profile
    target: dev
